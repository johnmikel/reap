<svg xmlns="http://www.w3.org/2000/svg" width="873" height="204" viewBox="0 0 873 204" role="img" aria-label="reap size — a made-up example">
<rect x="0.5" y="0.5" width="872" height="203" rx="10" fill="#0d1117" stroke="#30363d"/>
<circle cx="22" cy="22" r="6" fill="#ff5f56"/>
<circle cx="42" cy="22" r="6" fill="#ffbd2e"/>
<circle cx="62" cy="22" r="6" fill="#27c93f"/>
<text x="436.5" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#7d8590">reap size — a made-up example</text>
<text x="22" y="60" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve" style="white-space:pre"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="600">reap size .worktrees/fix/login-redirect .worktrees/feat/search-filters .worktrees/agent/billing-refactor</tspan></text>
<text x="22" y="80" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve" style="white-space:pre"><tspan fill="#c9d1d9">.worktrees/fix/login-redirect</tspan><tspan fill="#c9d1d9">         </tspan><tspan fill="#f0f6fc" font-weight="600">12 KB</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8590">du says 400 MB</tspan></text>
<text x="22" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve" style="white-space:pre"><tspan fill="#c9d1d9">.worktrees/feat/search-filters</tspan><tspan fill="#c9d1d9">        </tspan><tspan fill="#f0f6fc" font-weight="600">12 KB</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8590">du says 400 MB</tspan></text>
<text x="22" y="120" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve" style="white-space:pre"><tspan fill="#c9d1d9">.worktrees/agent/billing-refactor</tspan><tspan fill="#c9d1d9">     </tspan><tspan fill="#f0f6fc" font-weight="600">12 KB</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8590">du says 400 MB</tspan></text>
<text x="22" y="140" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve" style="white-space:pre"><tspan fill="#f0f6fc" font-weight="600">together</tspan><tspan fill="#c9d1d9">                             </tspan><tspan fill="#f0f6fc" font-weight="600">400 MB</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8590">du says 1.2 GB</tspan></text>
<text x="22" y="160" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve" style="white-space:pre"><tspan fill="#7d8590">The first column is what deleting the folder would give back: cloned data counts once,</tspan></text>
<text x="22" y="180" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve" style="white-space:pre"><tspan fill="#7d8590">and only when every copy is inside.</tspan></text>
</svg>
